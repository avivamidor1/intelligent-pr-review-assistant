[project]
name = "agent-workflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "״avivamidor1״", email = "aviv.studies1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.9",
    "langchain-anthropic>=1.7.10",
    "langchain-core>=1.7.7",
    "langgraph>=1.2.19",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "regex>=2026.1.15",
]

[project.scripts]
agent-workflow = "agent_workflow:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "langfuse>=5.2.0",
    "pytest>=9.2.0",
]
